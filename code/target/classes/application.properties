spring.application.name=demo

# 1. Konfigurasi Koneksi Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/PBO_TRPL
spring.datasource.username=postgres
spring.datasource.password=Herbert12
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Konfigurasi JPA & Hibernate (Untuk membuat/mencocokkan tabel otomatis)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Konfigurasi Port Server (Opsional, default-nya 8080)
server.port=8080

# 4. Menjalankan schema.sql (membuat tabel aritmatika dengan urutan kolom bil1, opt, bil2)
spring.sql.init.mode=always
